<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>01 商品正規化</title>
<link rel="stylesheet" href="./assets/app.css"/>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head><body>
<header>
  <div>
    <h1>チラシ×POS ローカル処理ツール（分割版）</h1>
    <small>本雛形はCDN依存。オフライン化する場合は script src をローカルに変更。</small>
  </div>
  <nav>
    <a href="./index.html">index</a>
    <a href="./01_import_items.html">01 商品</a>
    <a href="./02_normalize_stores.html">02 店舗</a>
    <a href="./03_parse_periods.html">03 期間</a>
    <a href="./04_join_pos.html">04 結合</a>
  </nav>
</header>
<div class="row">
  <div class="card">
    <h3>入力</h3>
    <label>p.xlsx または CSV（★チラシ明細）</label>
    <input id="fileP" type="file" accept=".xlsx,.csv"/>
    <div style="margin-top:12px;">
      <button id="run">01 実行</button>
      <button id="dlItems">items CSV</button>
      <button id="dlMaster">master CSV</button>
    </div>
    <small>出力は IndexedDB に保存（flyer_master / flyer_items / flyer_store_tokens）。</small>
  </div>
  <div class="card"><h3>ログ</h3><pre id="log"></pre></div>
</div>
<script type="module">
import { readJson, appendLog, downloadCSV } from "./assets/core/io.js";
import { normalizeJan } from "./assets/core/normalize.js";
import { parsePeriodFixedYM, dateKey } from "./assets/core/period.js";
import { save, load } from "./assets/core/state.js";

let settings = await readJson("./config/settings.json");
const log = document.getElementById("log");
function clean(s){ return String(s??"").replace(/[\r\n]+/g," ").trim(); }
function parseDateFlexible(val, fixedYear, fixedMonth) {
  if (val === null || val === undefined) return null;
  if (val instanceof Date && !Number.isNaN(val.getTime())) return val;
  let s = String(val).trim();
  if (!s) return null;
  s = s.replace(/\s+/g, "").replace(/／/g, "/").replace(/-/g, "/");
  let m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  m = s.match(/^(\d{1,2})\/(\d{1,2})$/);
  if (m) return new Date(fixedYear, Number(m[1]) - 1, Number(m[2]));
  if (/^\d{4,6}$/.test(s)) {
    const p = parsePeriodFixedYM(s, fixedYear, fixedMonth);
    return p.start;
  }
  return null;
}
function formatMD(d) {
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function resolvePeriod(row, rawKey, startKey, endKey, fixedYear, fixedMonth) {
  const raw = rawKey ? clean(row[rawKey]) : "";
  const start = startKey ? parseDateFlexible(row[startKey], fixedYear, fixedMonth) : null;
  const end = endKey ? parseDateFlexible(row[endKey], fixedYear, fixedMonth) : null;
  const rawFromDates = start || end
    ? start && end
      ? `${formatMD(start)}～${formatMD(end)}`
      : formatMD(start || end)
    : "";
  const rawUse = raw || rawFromDates;
  if (start || end) {
    const s = start || end;
    const e = end || start;
    if (s && e && e < s) return { raw: rawUse, start: e, end: s };
    return { raw: rawUse, start: s, end: e };
  }
  if (rawUse) {
    const p = parsePeriodFixedYM(rawUse, fixedYear, fixedMonth);
    return { raw: rawUse, start: p.start, end: p.end };
  }
  return { raw: rawUse, start: null, end: null };
}

document.getElementById("run").addEventListener("click", async ()=>{
  const f = document.getElementById("fileP").files[0];
  if (!f) return appendLog(log, "p.xlsx / CSV が未選択です");
  const isCsv = f.name.toLowerCase().endsWith(".csv");
  let rows = [];
  if (isCsv) {
    rows = await new Promise((resolve, reject)=>Papa.parse(f, {
      header: true,
      skipEmptyLines: true,
      complete: r => resolve(r.data),
      error: reject
    }));
  } else {
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, {type:"array"});
    const ws = wb.Sheets[settings.xlsx_sheet_name];
    if (!ws) throw new Error("Sheet not found: " + settings.xlsx_sheet_name);
    rows = XLSX.utils.sheet_to_json(ws, {defval:""});
  }

  const year = settings.target_year, month = settings.target_month;
  const C = isCsv ? settings.p_columns_csv : settings.p_columns;
  const flyerMaster = new Map();
  const items = [];
  const storeTokens = new Map();
  const rule = settings.flyer_type_rule;

  for (const r of rows) {
    const flyer_id = clean(r[C.flyer_id]);
    if (!flyer_id) continue;

    if (!flyerMaster.has(flyer_id)) {
      const flyer_type = flyer_id.includes(rule.if_filename_contains) ? rule.then_type : rule.else_type;
      const p = resolvePeriod(r, C.flyer_period, C.flyer_period_start, C.flyer_period_end, year, month);
      flyerMaster.set(flyer_id, {
        flyer_id, flyer_type,
        flyer_period_raw: p.raw,
        flyer_start: p.start ? dateKey(p.start) : "",
        flyer_end: p.end ? dateKey(p.end) : ""
      });
    }

    const tok = clean(r[C.store_token]);
    if (tok && !storeTokens.has(flyer_id)) storeTokens.set(flyer_id, tok);

    const jan = normalizeJan(r[C.jan]);
    if (jan) {
      const itemPeriod = resolvePeriod(r, C.item_period, C.item_period_start, C.item_period_end, year, month);
      items.push({
        flyer_id, jan,
        item_period_raw: itemPeriod.raw,
        product_name: clean(r[C.product_name]),
        sale_theme: clean(r[C.sale_theme]),
        dept_code: clean(r[C.dept_code]),
        price_base: clean(r[C.price_base]),
        price_tax: clean(r[C.price_tax]),
        margin: clean(r[C.margin])
      });
    }
  }

  const masterArr = Array.from(flyerMaster.values());
  const tokArr = Array.from(storeTokens.entries()).map(([flyer_id, store_token_raw])=>({flyer_id, store_token_raw}));

  await save("flyer_master", masterArr);
  await save("flyer_items", items);
  await save("flyer_store_tokens", tokArr);

  appendLog(log, `master=${masterArr.length} items=${items.length} tokens=${tokArr.length}`);
});

document.getElementById("dlItems").addEventListener("click", async ()=>{
  const items = await load("flyer_items") || [];
  if (!items.length) return appendLog(log, "items がありません");
  downloadCSV("flyer_items_normalized.csv", items);
});
document.getElementById("dlMaster").addEventListener("click", async ()=>{
  const master = await load("flyer_master") || [];
  if (!master.length) return appendLog(log, "master がありません");
  downloadCSV("flyer_master.csv", master);
});
</script>
</body></html>
